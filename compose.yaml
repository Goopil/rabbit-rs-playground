services:
    laravel.test:
        build:
            context: ./docker/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.5/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    rabbitmq-simple:
        image: rabbitmq:4.3-management
        hostname: rabbitmq-simple
        ports:
            - '${RABBITMQ_SIMPLE_AMQP_PORT:-5672}:5672'
            - '${RABBITMQ_SIMPLE_MGMT_PORT:-15672}:15672'
        environment:
            RABBITMQ_DEFAULT_USER: '${RABBITMQ_SIMPLE_USER:-guest}'
            RABBITMQ_DEFAULT_PASS: '${RABBITMQ_SIMPLE_PASS:-guest}'
            RABBITMQ_DEFAULT_VHOST: '${RABBITMQ_SIMPLE_VHOST:-/}'
        volumes:
            - 'sail-rabbitmq-simple:/var/lib/rabbitmq'
        networks:
            - sail
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
    rabbitmq-1:
        image: rabbitmq:4.3-management
        hostname: rabbitmq-1
        ports:
            - '${RABBITMQ_CLUSTER_AMQP_PORT:-5673}:5672'
            - '${RABBITMQ_CLUSTER_MGMT_PORT:-15673}:15672'
        environment:
            RABBITMQ_ERLANG_COOKIE: 'rabbit-rs-cluster-cookie'
            RABBITMQ_DEFAULT_USER: '${RABBITMQ_CLUSTER_USER:-guest}'
            RABBITMQ_DEFAULT_PASS: '${RABBITMQ_CLUSTER_PASS:-guest}'
            RABBITMQ_DEFAULT_VHOST: '${RABBITMQ_CLUSTER_VHOST:-/}'
        volumes:
            - 'sail-rabbitmq-1:/var/lib/rabbitmq'
            - './docker/rabbitmq/cluster/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro'
            - './docker/rabbitmq/cluster/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro'
        networks:
            - sail
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
    rabbitmq-2:
        image: rabbitmq:4.3-management
        hostname: rabbitmq-2
        environment:
            RABBITMQ_ERLANG_COOKIE: 'rabbit-rs-cluster-cookie'
            RABBITMQ_DEFAULT_USER: '${RABBITMQ_CLUSTER_USER:-guest}'
            RABBITMQ_DEFAULT_PASS: '${RABBITMQ_CLUSTER_PASS:-guest}'
            RABBITMQ_DEFAULT_VHOST: '${RABBITMQ_CLUSTER_VHOST:-/}'
        volumes:
            - 'sail-rabbitmq-2:/var/lib/rabbitmq'
            - './docker/rabbitmq/cluster/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro'
            - './docker/rabbitmq/cluster/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro'
        networks:
            - sail
        depends_on:
            rabbitmq-1:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
    rabbitmq-3:
        image: rabbitmq:4.3-management
        hostname: rabbitmq-3
        environment:
            RABBITMQ_ERLANG_COOKIE: 'rabbit-rs-cluster-cookie'
            RABBITMQ_DEFAULT_USER: '${RABBITMQ_CLUSTER_USER:-guest}'
            RABBITMQ_DEFAULT_PASS: '${RABBITMQ_CLUSTER_PASS:-guest}'
            RABBITMQ_DEFAULT_VHOST: '${RABBITMQ_CLUSTER_VHOST:-/}'
        volumes:
            - 'sail-rabbitmq-3:/var/lib/rabbitmq'
            - './docker/rabbitmq/cluster/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro'
            - './docker/rabbitmq/cluster/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro'
        networks:
            - sail
        depends_on:
            rabbitmq-1:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-rabbitmq-simple:
        driver: local
    sail-rabbitmq-1:
        driver: local
    sail-rabbitmq-2:
        driver: local
    sail-rabbitmq-3:
        driver: local

[unix_http_server]
file=/var/run/supervisor.sock

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:php]
command=%(ENV_SUPERVISOR_PHP_COMMAND)s
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; rabbit-rs 0.1.0 is connection-first: each worker process targets one queue
; connection (queue:work takes the connection as a positional argument).
; The vendor rabbit-rs:work fan-out is unusable here (it spawns children with
; `--connection=`, an option queue:work does not have in Laravel 13), so the
; combined "all" profiles are expanded into one program per connection.

[program:rabbit-rs-simple-single]
command=/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan queue:work simple-default --queue=simple.default.default,simple.default.high-priority --timeout=0
user=%(ENV_SUPERVISOR_PHP_USER)s
autostart=%(ENV_SUPERVISOR_RABBIT_RS_WORKERS)s
autorestart=true
stopsignal=TERM
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rabbit-rs-cluster-single]

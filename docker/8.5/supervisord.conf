[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
command=%(ENV_SUPERVISOR_PHP_COMMAND)s
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rabbit-rs-simple-single]
command=/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan queue:work --queue=simple.default.default,simple.default.high-priority --timeout=0
user=%(ENV_SUPERVISOR_PHP_USER)s
autostart=%(ENV_SUPERVISOR_RABBIT_RS_WORKERS)s
autorestart=true
stopsignal=TERM
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rabbit-rs-cluster-single]
command=/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan queue:work --queue=cluster.default.default,cluster.default.high-priority --timeout=0
user=%(ENV_SUPERVISOR_PHP_USER)s
autostart=%(ENV_SUPERVISOR_RABBIT_RS_WORKERS)s
autorestart=true
stopsignal=TERM
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rabbit-rs-simple-all]
command=/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan queue:work --queue=simple.all.default,simple.all.high-priority,simple.all.orders.created,simple.all.orders.paid,simple.all.orders.shipped,simple.all.notifications.email,simple.all.notifications.sms,simple.all.notifications.push --timeout=0
user=%(ENV_SUPERVISOR_PHP_USER)s
autostart=%(ENV_SUPERVISOR_RABBIT_RS_WORKERS)s
autorestart=true
stopsignal=TERM
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rabbit-rs-cluster-all]
command=/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan queue:work --queue=cluster.all.default,cluster.all.high-priority,cluster.all.orders.created,cluster.all.orders.paid,cluster.all.orders.shipped,cluster.all.notifications.email,cluster.all.notifications.sms,cluster.all.notifications.push --timeout=0
user=%(ENV_SUPERVISOR_PHP_USER)s
autostart=%(ENV_SUPERVISOR_RABBIT_RS_WORKERS)s
autorestart=true
stopsignal=TERM
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

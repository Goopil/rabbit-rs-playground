[unix_http_server]
file=/var/run/supervisor.sock

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:php]
; OCTANE_WATCH (env, default empty) may be set to "--watch" to hot-reload
; PHP workers on file changes (dev only — polling restarts workers).
command=%(ENV_SUPERVISOR_PHP_COMMAND)s %(ENV_OCTANE_WATCH)s
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:horizon]
command=/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan horizon
user=%(ENV_SUPERVISOR_PHP_USER)s
autostart=%(ENV_SUPERVISOR_HORIZON)s
autorestart=true
stopsignal=TERM
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ssr]
command=/usr/bin/node /var/www/html/node/clusterkit-server.mjs
directory=/var/www/html
user=%(ENV_SUPERVISOR_PHP_USER)s
autostart=%(ENV_SUPERVISOR_SSR)s
autorestart=true
stopsignal=TERM
stopasgroup=true
environment=WEB_CONCURRENCY="2",SSR_PORT="%(ENV_SSR_PORT)s",SSR_MAX_RSS_MB="%(ENV_SSR_MAX_RSS_MB)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

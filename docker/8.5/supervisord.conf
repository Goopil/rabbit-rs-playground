autorestart=true
stopsignal=TERM
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rabbit-rs-cluster-all]
command=/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan rabbit-rs:work --queue=cluster.all

[unix_http_server]
file=/var/run/supervisor.sock

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:php]
command=%(ENV_SUPERVISOR_PHP_COMMAND)s
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Rabbit-rs consumer. worker=horizon (RABBIT_RS_WORKER) makes the queue class
; emit Horizon events, so these jobs appear in the dashboard next to the
; redis ones. Horizon itself cannot consume this connection yet (AutoScaler
; calls readyNow() on the queue class, see docs/upstream-rabbit-rs-laravel.md).

[program:rabbit-rs]
command=/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan queue:work rabbit-rs --queue=default,high-priority,bulk --timeout=0
user=%(ENV_SUPERVISOR_PHP_USER)s
autostart=true
autorestart=true
stopsignal=TERM
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:horizon]
command=/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan horizon
user=%(ENV_SUPERVISOR_PHP_USER)s
autostart=%(ENV_SUPERVISOR_HORIZON)s
autorestart=true
stopsignal=TERM
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ssr]
command=/usr/bin/node /var/www/html/node/clusterkit-server.mjs
directory=/var/www/html
user=%(ENV_SUPERVISOR_PHP_USER)s
autostart=%(ENV_SUPERVISOR_SSR)s
autorestart=true
stopsignal=TERM
stopasgroup=true
environment=WEB_CONCURRENCY="2",SSR_PORT="%(ENV_SSR_PORT)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
